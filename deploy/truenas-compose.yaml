# TrueNAS SCALE (24.10+): Apps → Discover Apps → ⋮ → Install via YAML → paste this file.
# Replace every CHANGE_ME. See docs/DEPLOY.md for the Authentik and reverse-proxy setup.
name: ebbwell

services:
  ebbwell:
    image: ghcr.io/maxren2/ebbwell:0.7.5
    restart: unless-stopped
    user: "568:568"            # TrueNAS "apps" user; must own the dataset below
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      # Reachable by the reverse proxy and, for local accounts, by browsers on your LAN
      # (http://<nas-ip>:30504). Never forward this port from the internet.
      - "30504:8080"
    environment:
      APP_URL: "https://ebbwell.CHANGE_ME.example"
      # Authentik → Applications → Providers → OAuth2/OpenID (see docs/DEPLOY.md)
      OIDC_ISSUER: "https://auth.CHANGE_ME.example/application/o/ebbwell/"
      OIDC_CLIENT_ID: "CHANGE_ME"
      OIDC_CLIENT_SECRET: "CHANGE_ME"
      OIDC_PROVIDER_NAME: "Authentik"
      OIDC_ALLOWED_GROUPS: "ebbwell-users"
      OIDC_ADMIN_GROUPS: ""                # e.g. "authentik Admins" to make those users Ebbwell admins
      # Local accounts (username + password): disabled | local-network | everywhere (docs/DEPLOY.md section 2).
      # local-network = passwords only from your LAN by the NAS address, never through the public domain.
      LOCAL_LOGIN: "local-network"
      # Two-factor (authenticator app) for local accounts: optional | required
      LOCAL_2FA: "optional"
      # First local administrator, created at startup; remove ADMIN_PASSWORD once you've signed in.
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "CHANGE_ME_at_least_10_chars"
      # 32 random bytes, base64: `openssl rand -base64 32`. Losing it = losing the data. Back it up offline.
      DATA_ENCRYPTION_KEY: "CHANGE_ME"
      # IP ranges of your reverse proxy, so rate limiting sees real client IPs.
      TRUST_PROXY: "loopback,uniquelocal"
      HSTS: "true"
      SESSION_IDLE_DAYS: "14"
      SESSION_MAX_DAYS: "90"
      BACKUP_RETENTION_DAYS: "14"
      TZ: "Europe/Paris"
    volumes:
      # Use an (ideally encrypted) dataset, e.g. created as apps/ebbwell with owner 568:568.
      - /mnt/CHANGE_ME_POOL/apps/ebbwell:/data
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
