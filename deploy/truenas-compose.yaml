# TrueNAS SCALE (24.10+): Apps → Discover Apps → ⋮ → Install via YAML → paste this file.
# Replace every CHANGE_ME. See docs/DEPLOY.md for the Authentik and reverse-proxy setup.
name: lune

services:
  lune:
    image: ghcr.io/maxren2/lune:latest
    restart: unless-stopped
    user: "568:568"            # TrueNAS "apps" user; must own the dataset below
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      # Only the reverse proxy should reach this port. Bind it to the LAN IP of the NAS
      # (or put the proxy on the same Docker network and remove `ports` entirely).
      - "30480:8080"
    environment:
      APP_URL: "https://lune.CHANGE_ME.example"
      # Authentik → Applications → Providers → OAuth2/OpenID (see docs/DEPLOY.md)
      OIDC_ISSUER: "https://auth.CHANGE_ME.example/application/o/lune/"
      OIDC_CLIENT_ID: "CHANGE_ME"
      OIDC_CLIENT_SECRET: "CHANGE_ME"
      OIDC_ALLOWED_GROUPS: "lune-users"
      # 32 random bytes, base64: `openssl rand -base64 32`. Losing it = losing the data. Back it up offline.
      DATA_ENCRYPTION_KEY: "CHANGE_ME"
      # IP ranges of your reverse proxy, so rate limiting sees real client IPs.
      TRUST_PROXY: "loopback,uniquelocal"
      HSTS: "true"
      SESSION_IDLE_DAYS: "14"
      SESSION_MAX_DAYS: "90"
      BACKUP_RETENTION_DAYS: "14"
      TZ: "Europe/Paris"
    volumes:
      # Use an (ideally encrypted) dataset, e.g. created as apps/lune with owner 568:568.
      - /mnt/CHANGE_ME_POOL/apps/lune:/data
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
