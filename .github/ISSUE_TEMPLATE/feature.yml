name: Feature request
description: Suggest an idea or something that's missing.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste cycle data or other personal health details** — this page is public.
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the need or the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: input
    id: version
    attributes:
      label: Ebbwell version
      placeholder: 0.5.1
